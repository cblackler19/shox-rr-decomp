name: Shox (August 2002 prototype)
options:
  platform: ps2
  compiler: EEGCC
  endianness: little
  basename: SHOX_proto
  base_path: ../..
  target_path: prototypes/19-08-2002/SHOX.ELF
  elf_path: prototypes/19-08-2002/SHOX.ELF
  asm_path: asm/prototype
  src_path: src
  build_path: build/prototype
  asset_path: build/prototype/assets
  cache_path: build/prototype/.splache
  ld_script_path: build/prototype/SHOX.ld
  undefined_funcs_auto_path: build/prototype/undefined_funcs_auto.txt
  undefined_syms_auto_path: build/prototype/undefined_syms_auto.txt
  create_c_files: False
  subalign: null
  find_file_boundaries: False
  migrate_rodata_to_functions: False
  section_order: ['.text', '.data', '.rodata', '.sdata', '.sbss', '.bss']
segments:
  - [0x0, bin, elf_header]
  - name: main
    type: code
    start: 0x1000
    vram: 0x00100000
    subsegments:
      - [0x1000, asm, text]
      - [0x1D5484, bin, pad_text_vutext]
      - [0x1D5490, bin, vutext]
      - [0x1DA300, data, data]
      - [0x346AB4, bin, pad_data_rodata]
      - [0x346B00, rodata, rodata]
      - [0x3827F8, bin, pad_rodata_except]
      - [0x382800, bin, gcc_except_table]
      - [0x38285C, bin, pad_except_lit4]
      - [0x382880, bin, lit4]
      - [0x382884, bin, pad_lit4_sdata]
      - [0x382900, data, sdata]
      - [0x382A44, bin, pad_sdata_end]
  - [0x382A84]
