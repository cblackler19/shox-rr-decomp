
name: ByteMatch Progress

on:
  push:
    branches:
      - main
    paths:
      - "src/retail/**"
      - "config/retail/functions.json"
      - "tools/objdiff/**"
      - "build.ninja"
      - "objdiff.json"
      - ".github/workflows/bytematch.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    name: Generate retail progress
    runs-on: [self-hosted, Windows, X64, shox-retail]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate local prerequisites
        shell: pwsh
        run: |
          $required = @(
            "baserom/SHOX.ELF",
            "asm/retail/text.s",
            "toolchain/eegcc_sn_v2.73a/bin/ee-gcc295.exe",
            "toolchain/eegcc_sn_v2.73a/bin/ee-as.exe",
            "toolchain/objdiff-cli.exe"
          )

          foreach ($path in $required) {
            if (!(Test-Path $path)) {
              throw "Missing required local file: $path"
            }
          }

          ninja --version
          python --version

      - name: Generate build configuration
        shell: pwsh
        run: |
          python tools/objdiff/manage.py validate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          python tools/objdiff/manage.py sync
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build registered functions
        shell: pwsh
        run: |
          ninja
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          ninja `
            build/objdiff/target/func_0010AA78.o `
            build/objdiff/target/func_0010AA80.o `
            build/objdiff/target/func_002103A0.o

          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build function inventory
        shell: pwsh
        run: |
          ninja build/objdiff/target/retail_inventory.o
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Generate objdiff report
        shell: pwsh
        run: |
          & "./toolchain/objdiff-cli.exe" report generate `
            -p . `
            -o reports/retail/report.json

          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate progress
        shell: pwsh
        run: |
          $report = Get-Content `
            reports/retail/report.json -Raw |
            ConvertFrom-Json

          $m = $report.measures

          if ([int]$m.total_code -ne 1905072) {
            throw "Unexpected total code"
          }

          if ([int]$m.total_functions -ne 7408) {
            throw "Unexpected function count"
          }

          if ([int]$m.matched_code -lt 28) {
            throw "Matched code regressed"
          }

          if ([int]$m.matched_functions -lt 3) {
            throw "Matched functions regressed"
          }

          Write-Host "ByteMatch progress validated"
          $m | Format-List

      - name: Upload ByteMatch report
        uses: actions/upload-artifact@v4
        with:
          name: retail_report
          path: reports/retail/report.json
          if-no-files-found: error
          retention-days: 90
