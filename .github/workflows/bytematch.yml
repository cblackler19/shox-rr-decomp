
name: ByteMatch Progress

on:
  push:
    branches:
      - main
    paths:
      - "reports/retail/report.json"
      - ".github/workflows/bytematch.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    name: Publish retail progress
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate report
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("reports/retail/report.json")
          report = json.loads(path.read_text())
          measures = report["measures"]

          assert report["version"] == 2, "Unsupported objdiff report version"

          total_code = int(measures["total_code"])
          matched_code = int(measures["matched_code"])
          total_functions = int(measures["total_functions"])
          matched_functions = int(measures["matched_functions"])
          matched_percent = float(measures["matched_code_percent"])

          assert total_code > 0, "Total code must be positive"
          assert total_functions > 0, "Total functions must be positive"
          assert 0 <= matched_code <= total_code, "Invalid matched code count"
          assert 0 <= matched_functions <= total_functions, "Invalid matched function count"
          assert matched_functions >= 433, "Registered function progress regressed"
          assert matched_code >= 15108, "Matched code progress regressed"
          assert 0 <= matched_percent <= 100, "Invalid matched code percentage"
          assert abs(matched_percent - 100 * matched_code / total_code) < 0.01, (
              "Matched code percentage does not agree with code counts"
          )

          print("Retail report validation: PASS")
          print(f"Matched functions: {matched_functions}/{total_functions}")
          print(f"Matched code: {matched_code}/{total_code}")
          print(f"Progress: {matched_percent:.2f}%")
          PY

      - name: Upload ByteMatch report
        uses: actions/upload-artifact@v4
        with:
          name: retail_report
          path: reports/retail/report.json
          if-no-files-found: error
          retention-days: 90
